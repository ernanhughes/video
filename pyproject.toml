[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ernan-video"
version = "0.1.0"
description = "AI-native programmable video runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
video = "video_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video_runtime", "src/video_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
